<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: Arial, sans-serif; font-size: 13px; color: #222; margin: 0; padding: 4px 8px; }
  label { display: block; font-weight: bold; margin-top: 8px; font-size: 12px; }
  input, select { width: 100%; box-sizing: border-box; padding: 5px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th { background: #C89B2A; color: #fff; padding: 5px; font-size: 12px; text-align: left; }
  td { padding: 3px; border-bottom: 1px solid #eee; }
  td input, td select { padding: 3px; }
  .r { text-align: right; white-space: nowrap; }
  .tot { margin-top: 10px; text-align: right; font-size: 14px; }
  .tot b { color: #1B2B5E; }
  button { padding: 7px 14px; margin: 10px 6px 0 0; cursor: pointer; border: 0; border-radius: 3px; }
  .prim { background: #1B2B5E; color: #fff; }
  .sec { background: #eee; }
  #msg { margin-top: 8px; color: #1B2B5E; white-space: pre-wrap; }
  .err { color: #b00020 !important; }
</style>
</head>
<body>
  <div class="grid">
    <div><label>Entité facturée</label><select id="entite"></select></div>
    <div><label>Date</label><input type="date" id="date"></div>
    <div><label>Validité (jours)</label><input type="number" id="validite"></div>
    <div><label>Contact client</label><input id="contact"></div>
  </div>
  <div class="grid2">
    <div><label>Objet</label><input id="objet" placeholder="Ex. Formation Excel Perfectionnement — 10 participants"></div>
    <div><label>Lieu (par défaut pour les lignes)</label><input id="lieu"></div>
  </div>

  <table id="t">
    <thead><tr><th style="width:30%">Article du catalogue</th><th>Désignation</th><th style="width:8%">Durée (h)</th>
      <th style="width:8%">Qté</th><th style="width:12%">PU HT</th><th style="width:12%" class="r">Montant</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
  <button class="sec" onclick="ajouterLigne()">+ Ligne</button>

  <div class="tot">Total HT : <b id="ht">0</b> · TVA : <b id="tva">0</b> · Total TTC : <b id="ttc">0</b> Ar</div>

  <button class="sec" onclick="envoyer(false)">Enregistrer en brouillon</button>
  <button class="prim" onclick="envoyer(true)">Créer et émettre (n° + PDF)</button>
  <button class="sec" onclick="google.script.host.close()">Fermer</button>
  <div id="msg"></div>

<script>
  let D = { entites: [], catalogue: [], tva: 0 };
  const fmt = n => Math.round(n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

  google.script.run.withSuccessHandler(d => {
    D = d;
    const sel = document.getElementById('entite');
    sel.innerHTML = '<option value="">— choisir —</option>' + d.entites.map(e =>
      `<option value="${e.id}" data-contact="${(e.contact || '').replace(/"/g, '&quot;')}">${e.nom}${e.groupe && e.groupe !== e.nom ? ' (groupe ' + e.groupe + ')' : ''}</option>`).join('');
    sel.onchange = () => { const o = sel.selectedOptions[0]; document.getElementById('contact').value = o ? o.dataset.contact || '' : ''; };
    document.getElementById('validite').value = d.validite;
    document.getElementById('date').value = new Date().toISOString().slice(0, 10);
    ajouterLigne();
  }).withFailureHandler(err).donneesFormulaire();

  function ajouterLigne() {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><select class="code"><option value="">— libre —</option>${
      D.catalogue.map(c => `<option value="${c.code}">${c.domaine} · ${c.designation}${c.pu ? ' · ' + fmt(c.pu) : ''}</option>`).join('')}</select></td>
      <td><input class="des"></td><td><input class="dur" type="number"></td>
      <td><input class="qte" type="number" value="1" min="0"></td><td><input class="pu" type="number" min="0"></td>
      <td class="r mt">0</td><td><button class="sec" style="margin:0;padding:3px 7px">×</button></td>`;
    tr.querySelector('.code').onchange = e => {
      const c = D.catalogue.find(x => x.code === e.target.value);
      if (c) { tr.querySelector('.des').value = c.designation; tr.querySelector('.dur').value = c.duree || ''; tr.querySelector('.pu').value = c.pu || 0; tr.dataset.domaine = c.domaine; }
      calc();
    };
    tr.querySelectorAll('input').forEach(i => i.oninput = calc);
    tr.querySelector('button').onclick = () => { tr.remove(); calc(); };
    document.querySelector('#t tbody').appendChild(tr);
  }

  function lignes() {
    return [...document.querySelectorAll('#t tbody tr')].map(tr => ({
      code: tr.querySelector('.code').value, domaine: tr.dataset.domaine || 'Divers',
      designation: tr.querySelector('.des').value, duree: tr.querySelector('.dur').value,
      quantite: Number(tr.querySelector('.qte').value) || 0, pu: Number(tr.querySelector('.pu').value) || 0
    })).filter(l => l.designation);
  }

  function calc() {
    let ht = 0;
    document.querySelectorAll('#t tbody tr').forEach(tr => {
      let m = (Number(tr.querySelector('.qte').value) || 0) * (Number(tr.querySelector('.pu').value) || 0);
      if (tr.querySelector('.code').value === 'DIV-REMISE') m = -Math.abs(m);
      tr.querySelector('.mt').textContent = fmt(m); ht += m;
    });
    const tva = Math.round(ht * D.tva);
    document.getElementById('ht').textContent = fmt(ht);
    document.getElementById('tva').textContent = fmt(tva);
    document.getElementById('ttc').textContent = fmt(ht + tva);
  }

  function envoyer(emettre) {
    const data = {
      idEntite: document.getElementById('entite').value, date: document.getElementById('date').value,
      validite: Number(document.getElementById('validite').value), contact: document.getElementById('contact').value,
      objet: document.getElementById('objet').value, lieu: document.getElementById('lieu').value,
      lignes: lignes(), emettre: emettre
    };
    msg('Traitement…');
    document.querySelectorAll('button').forEach(b => b.disabled = true);
    google.script.run.withSuccessHandler(r => {
      document.querySelectorAll('button').forEach(b => b.disabled = false);
      msg(r.message + (r.url ? '' : ''));
    }).withFailureHandler(e => { document.querySelectorAll('button').forEach(b => b.disabled = false); err(e); }).creerProforma(data);
  }
  function msg(t) { const m = document.getElementById('msg'); m.className = ''; m.textContent = t; }
  function err(e) { const m = document.getElementById('msg'); m.className = 'err'; m.textContent = 'Erreur : ' + (e.message || e); }
</script>
</body>
</html>
