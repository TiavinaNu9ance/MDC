<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Segoe UI", Roboto, Arial, sans-serif;
  --r-s: 8px; --r: 12px; --r-l: 18px;
  --ease: cubic-bezier(.25,.1,.25,1);
}
html[data-theme="light"] {
  --bg: #f5f5f7; --surface: #ffffff; --surface-2: #fbfbfd; --fill: rgba(120,120,128,.12); --fill-2: rgba(120,120,128,.08);
  --text: #1d1d1f; --text-2: #6e6e73; --text-3: #aeaeb2; --sep: rgba(0,0,0,.08); --sep-2: rgba(0,0,0,.05);
  --accent: #0071e3; --accent-soft: rgba(0,113,227,.1); --on-accent: #fff;
  --green: #248a3d; --green-soft: rgba(52,199,89,.14); --orange: #b25000; --orange-soft: rgba(255,149,0,.14);
  --red: #d70015; --red-soft: rgba(255,59,48,.12); --purple: #8944ab; --purple-soft: rgba(175,82,222,.12);
  --sidebar: rgba(242,242,247,.82); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  --shadow-l: 0 20px 60px rgba(0,0,0,.18); --backdrop: rgba(0,0,0,.18); --input: #ffffff; color-scheme: light;
}
html[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --surface-2: #232325; --fill: rgba(120,120,128,.28); --fill-2: rgba(120,120,128,.18);
  --text: #f5f5f7; --text-2: #98989d; --text-3: #636366; --sep: rgba(255,255,255,.1); --sep-2: rgba(255,255,255,.06);
  --accent: #0a84ff; --accent-soft: rgba(10,132,255,.18); --on-accent: #fff;
  --green: #30d158; --green-soft: rgba(48,209,88,.16); --orange: #ff9f0a; --orange-soft: rgba(255,159,10,.16);
  --red: #ff453a; --red-soft: rgba(255,69,58,.16); --purple: #bf5af2; --purple-soft: rgba(191,90,242,.16);
  --sidebar: rgba(28,28,30,.78); --shadow: 0 0 0 1px rgba(255,255,255,.04); --shadow-l: 0 24px 70px rgba(0,0,0,.6);
  --backdrop: rgba(0,0,0,.5); --input: #2c2c2e; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: var(--accent); text-decoration: none; }
.mut { color: var(--text-2); } .mut3 { color: var(--text-3); } .r { text-align: right; white-space: nowrap; } .nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Layout ---------- */
.app { display: flex; min-height: 100vh; }
aside { width: 248px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; background: var(--sidebar);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-right: 1px solid var(--sep); display: flex; flex-direction: column; padding: 18px 12px 12px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #1b2b5e, #3a5bb8); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 11px; letter-spacing: .02em; flex-shrink: 0; }
.brand b { font-size: 15px; font-weight: 600; display: block; } .brand small { display: block; color: var(--text-2); font-size: 11.5px; }
.navsec { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; padding: 14px 10px 6px; }
.navi { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 7px 10px; border-radius: var(--r-s);
  cursor: pointer; color: var(--text); font-size: 13.5px; text-align: left; transition: background .15s var(--ease); }
.navi:hover { background: var(--fill-2); }
.navi.on { background: var(--accent); color: var(--on-accent); }
.navi svg { width: 17px; height: 17px; flex-shrink: 0; opacity: .85; }
.navi .cnt { margin-left: auto; font-size: 11.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.navi.on .cnt { color: rgba(255,255,255,.85); }
.me { margin-top: auto; border-top: 1px solid var(--sep); padding-top: 10px; position: relative; }
.mebtn { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 8px; border-radius: var(--r-s); cursor: pointer; text-align: left; }
.mebtn:hover { background: var(--fill-2); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; font-weight: 600; font-size: 12.5px; flex-shrink: 0; }
.mebtn b { display: block; font-size: 13px; font-weight: 600; } .mebtn small { color: var(--text-2); font-size: 11.5px; }
.menu { position: absolute; bottom: 58px; left: 0; right: 0; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-l);
  border: 1px solid var(--sep); padding: 6px; z-index: 40; animation: pop .15s var(--ease); }
.menu button { display: flex; width: 100%; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 13.5px; }
.menu button:hover { background: var(--accent); color: #fff; }
.menu hr { border: 0; border-top: 1px solid var(--sep); margin: 5px 4px; }
.menu .lab { font-size: 11.5px; color: var(--text-2); padding: 6px 10px 4px; }
main { flex: 1; min-width: 0; padding: 28px 36px 80px; max-width: 1320px; }
.head { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
.head h1 { font-size: 30px; font-weight: 700; letter-spacing: -.025em; margin: 0; }
.head .sub { color: var(--text-2); margin-top: 3px; }
.head .sp { flex: 1; }
.crumb { font-size: 13px; color: var(--text-2); margin-bottom: 6px; } .crumb a { color: var(--accent); cursor: pointer; }

/* ---------- Contrôles ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 980px; padding: 7px 15px; background: var(--fill); color: var(--text);
  cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap; transition: transform .1s var(--ease), filter .15s, opacity .15s; }
.btn:hover { filter: brightness(.96); } .btn:active { transform: scale(.97); }
html[data-theme="dark"] .btn:hover { filter: brightness(1.15); }
.btn.p { background: var(--accent); color: var(--on-accent); }
.btn.d { color: var(--red); background: var(--red-soft); }
.btn.t { background: none; color: var(--accent); padding-left: 8px; padding-right: 8px; }
.btn.sm { padding: 5px 11px; font-size: 12.5px; }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn svg { width: 15px; height: 15px; }
input, select, textarea { width: 100%; border: 1px solid var(--sep); background: var(--input); border-radius: var(--r-s); padding: 8px 11px; outline: none;
  transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-soft); }
input:disabled { opacity: .6; }
textarea { resize: vertical; min-height: 70px; }
label.f { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin: 12px 0 5px; }
.search { position: relative; } .search input { padding-left: 32px; border-radius: 980px; background: var(--fill-2); border-color: transparent; width: 240px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; color: var(--text-2); }
.seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: none; padding: 5px 13px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--text); white-space: nowrap; }
.seg button.on { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); font-weight: 500; }
html[data-theme="dark"] .seg button.on { background: #636366; }
.switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; display: inline-block; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--fill); border-radius: 26px; cursor: pointer; transition: background .2s var(--ease); }
.switch span::before { content: ""; position: absolute; width: 22px; height: 22px; left: 2px; top: 2px; background: #fff; border-radius: 50%;
  box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s var(--ease); }
.switch input:checked + span { background: #34c759; } .switch input:checked + span::before { transform: translateX(18px); }

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow); padding: 20px; margin-bottom: 18px; }
.card h2 { font-size: 17px; font-weight: 600; margin: 0 0 14px; letter-spacing: -.015em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h2 .sp { flex: 1; }
.grid { display: grid; gap: 18px; } .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
.tile { background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow); padding: 16px 18px; cursor: pointer; transition: transform .15s var(--ease); }
.tile:hover { transform: translateY(-1px); }
.tile .l { font-size: 12.5px; color: var(--text-2); font-weight: 500; } .tile .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--text-2); margin-top: 2px; } .tile.alert .v { color: var(--red); }
.mini { background: var(--fill-2); border-radius: var(--r); padding: 12px 14px; } .mini .l { font-size: 12px; color: var(--text-2); } .mini .v { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.list { background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow); overflow: hidden; }
.list.flat { box-shadow: none; border: 1px solid var(--sep); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 500; color: var(--text-2); padding: 11px 14px; border-bottom: 1px solid var(--sep); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--sep-2); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.cl { cursor: pointer; } tr.cl:hover td { background: var(--fill-2); }
td.main b { font-weight: 600; } td small { display: block; color: var(--text-2); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 980px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-g { background: var(--green-soft); color: var(--green); } .p-o { background: var(--orange-soft); color: var(--orange); }
.p-r { background: var(--red-soft); color: var(--red); } .p-b { background: var(--accent-soft); color: var(--accent); }
.p-n { background: var(--fill-2); color: var(--text-2); } .p-v { background: var(--purple-soft); color: var(--purple); }
.empty { text-align: center; padding: 46px 20px; color: var(--text-2); }
.empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; font-weight: 600; }
.rows .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--sep-2); }
.rows .row:last-child { border-bottom: 0; } .rows .row.cl { cursor: pointer; } .rows .row .sp { flex: 1; min-width: 0; }
.ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; }
.ico::before { display: none; } .ico svg { width: 16px; height: 16px; }

/* ---------- Groupes façon Réglages ---------- */
.group { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); margin-bottom: 26px; overflow: hidden; }
.sheet .group { box-shadow: none; border: 1px solid var(--sep); }
.gtitle { font-size: 12.5px; color: var(--text-2); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 7px 16px; font-weight: 500; }
.gitem { display: flex; align-items: center; gap: 16px; padding: 11px 16px; min-height: 48px; border-bottom: 1px solid var(--sep-2); }
.gitem:last-child { border-bottom: 0; }
.gitem > .k { width: 38%; flex-shrink: 0; } .gitem > .k b { font-weight: 500; display: block; } .gitem > .k small { color: var(--text-2); font-size: 12px; display: block; }
.gitem > .v { flex: 1; min-width: 0; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.gitem > .v > input:not([type=checkbox]), .gitem > .v > textarea { max-width: 460px; }
.gitem input[type=color] { width: 44px; height: 30px; padding: 2px; border-radius: 8px; }
.gimg { width: 120px; height: 52px; border-radius: 8px; background: var(--fill-2); display: grid; place-items: center; overflow: hidden; }
.gimg img { max-width: 100%; max-height: 100%; }
.savebar { position: sticky; bottom: 16px; display: flex; justify-content: flex-end; gap: 10px; padding: 12px 16px; background: var(--sidebar);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: var(--r); box-shadow: var(--shadow-l); margin-top: 10px; align-items: center; animation: pop .2s var(--ease); }

/* ---------- Panneau latéral & dialogues ---------- */
.backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 50; animation: fade .2s var(--ease); }
.sheet { position: fixed; top: 10px; right: 10px; bottom: 10px; width: min(620px, calc(100vw - 20px)); background: var(--surface); border-radius: var(--r-l);
  box-shadow: var(--shadow-l); z-index: 51; display: flex; flex-direction: column; animation: slide .28s var(--ease); }
.sheet.large { width: min(1000px, calc(100vw - 20px)); }
.sheet .sh { padding: 18px 22px 14px; border-bottom: 1px solid var(--sep); display: flex; align-items: flex-start; gap: 12px; }
.sheet .sh h3 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.02em; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .sheet .sh .sp { flex: 1; min-width: 0; }
.sheet .sb { padding: 18px 22px; overflow-y: auto; flex: 1; }
.sheet .sf { padding: 14px 22px; border-top: 1px solid var(--sep); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.x { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--fill); cursor: pointer; display: grid; place-items: center; color: var(--text-2); flex-shrink: 0; padding: 0; }
.x svg { width: 14px; height: 14px; }
@keyframes slide { from { transform: translateX(40px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes pop { from { transform: scale(.96); opacity: 0 } to { transform: none; opacity: 1 } }
.dialog { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(400px, calc(100vw - 32px)); background: var(--surface);
  border-radius: 16px; box-shadow: var(--shadow-l); z-index: 61; padding: 24px 22px 18px; text-align: center; }
.dialog h4 { margin: 0 0 6px; font-size: 16px; font-weight: 600; } .dialog p { color: var(--text-2); margin: 0 0 18px; font-size: 13.5px; }
.dialog .acts { display: flex; gap: 8px; } .dialog .acts .btn { flex: 1; justify-content: center; }

/* ---------- Parcours ---------- */
.steps { display: flex; margin: 2px 0 20px; overflow-x: auto; }
.step { flex: 1; min-width: 80px; text-align: center; position: relative; font-size: 11.5px; color: var(--text-2); padding-top: 26px; }
.step::before { content: ""; position: absolute; top: 9px; left: 50%; width: 100%; height: 2px; background: var(--fill); }
.step:last-child::before { display: none; }
.step i { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; border-radius: 50%; background: var(--surface);
  border: 2px solid var(--fill); z-index: 1; display: grid; place-items: center; font-style: normal; font-size: 11px; color: #fff; }
.step.done i { background: var(--green); border-color: var(--green); } .step.done::before { background: var(--green); }
.step.cur i { border-color: var(--accent); background: var(--accent-soft); } .step.cur { color: var(--text); font-weight: 600; }
.phases { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.phase { border-radius: var(--r); padding: 12px; background: var(--fill-2); }
.phase .n { font-size: 11px; font-weight: 600; color: var(--text-2); letter-spacing: .03em; } .phase .t { font-size: 13px; font-weight: 500; margin: 3px 0 10px; min-height: 36px; }
.phase.Fait { background: var(--green-soft); } .phase.Fait .n { color: var(--green); }
.phase.Encours { background: var(--orange-soft); } .phase.Encours .n { color: var(--orange); }
.phase select { padding: 6px 8px; font-size: 13px; }
.bar { display: inline-flex; gap: 3px; vertical-align: middle; } .bar i { width: 14px; height: 6px; border-radius: 3px; background: var(--fill); }
.bar i.F { background: var(--green); } .bar i.E { background: #ff9f0a; } .bar i.N { background: var(--text-3); }
.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; }
.col { min-width: 244px; max-width: 244px; background: var(--fill-2); border-radius: var(--r); padding: 10px; }
.col h4 { margin: 2px 4px 10px; font-size: 12.5px; font-weight: 600; display: flex; gap: 6px; } .col h4 span { color: var(--text-2); font-weight: 500; }
.kc { background: var(--surface); border-radius: 10px; padding: 11px 12px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow); font-size: 13px; }
.kc b { font-weight: 600; } .kc.due { box-shadow: inset 3px 0 0 var(--red), var(--shadow); }

/* ---------- Éditeur & aperçu ---------- */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 470px); gap: 22px; align-items: start; }
.preview { position: sticky; top: 20px; }
.paper { background: #fff; border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.08), 0 18px 40px rgba(0,0,0,.08); overflow: hidden; position: relative; }
.paper iframe { border: 0; width: 794px; height: 1123px; transform-origin: 0 0; display: block; pointer-events: none; position: absolute; top: 0; left: 0; }
.grid > * { min-width: 0; }
.lines td { padding: 6px; } .lines input, .lines select { padding: 6px 8px; font-size: 13px; }
.totals { display: flex; justify-content: flex-end; gap: 26px; padding: 16px 4px 0; font-size: 13.5px; flex-wrap: wrap; }
.totals b { font-size: 17px; font-weight: 600; } .totals div { text-align: right; } .totals small { display: block; color: var(--text-2); font-size: 11.5px; }
.form { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 14px; } .form .w2 { grid-column: span 2; } .form .w4 { grid-column: 1 / -1; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 9px 14px; font-size: 13.5px; } .kv > span { color: var(--text-2); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 980px; background: var(--fill-2); cursor: pointer; font-size: 13px; border: 1px solid transparent; user-select: none; }
.chip:hover { background: var(--fill); }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* ---------- Connexion ---------- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.lcard { width: min(400px, 100%); background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-l); padding: 38px 32px 30px; text-align: center; animation: pop .25s var(--ease); }
.lcard .logo { width: 58px; height: 58px; border-radius: 16px; margin: 0 auto 18px; font-size: 17px; }
.lcard h1 { font-size: 25px; margin: 0 0 6px; letter-spacing: -.02em; font-weight: 700; } .lcard p { color: var(--text-2); margin: 0 0 22px; }
.lcard input { text-align: center; font-size: 16px; padding: 12px; border-radius: 12px; }
.lcard .code { letter-spacing: 10px; font-size: 24px; font-weight: 600; }
.lcard .btn { width: 100%; justify-content: center; padding: 11px; font-size: 15px; margin-top: 12px; }
.lcard .btn.t { width: auto; margin-top: 10px; font-size: 13.5px; }

/* ---------- Divers ---------- */
#toasts { position: fixed; top: 16px; right: 16px; z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { background: var(--surface); color: var(--text); border-radius: 14px; padding: 11px 18px; box-shadow: var(--shadow-l); border: 1px solid var(--sep);
  font-size: 13.5px; max-width: min(380px, 92vw); animation: slide .25s var(--ease); white-space: pre-wrap; }
.toast.err { color: var(--red); }
.loader { position: fixed; top: 0; left: 0; height: 2.5px; background: var(--accent); z-index: 90; animation: load 1.2s var(--ease) infinite; }
@keyframes load { 0% { left: 0; width: 0 } 50% { left: 20%; width: 50% } 100% { left: 100%; width: 0 } }
.alerte { color: var(--red); font-size: 12.5px; }
.hint { color: var(--text-2); font-size: 12.5px; margin-top: 8px; }
.mobnav { display: none; }
@media (max-width: 1080px) { .editor { grid-template-columns: 1fr; } .preview { position: static; } .sheet .g2 { grid-template-columns: 1fr; } }
@media (max-width: 860px) {
  aside { display: none; } main { padding: 18px 16px 96px; } .head h1 { font-size: 26px; }
  .g2, .g3, .form, .phases { grid-template-columns: 1fr; } .form .w2 { grid-column: auto; }

<script>
/* =====================================================================

   ===================================================================== */
const S = { jeton: null, moi: null, espace: 'admin', d: null, vue: 'accueil', sel: null, ed: null, q: '', f: {}, menu: false, set: null };
const $ = id => document.getElementById(id);
const memo = {};
const store = {
  get(k) { try { return localStorage.getItem('mdc.' + k); } catch (e) { return memo[k] || null; } },
  set(k, v) { try { v === null ? localStorage.removeItem('mdc.' + k) : localStorage.setItem('mdc.' + k, v); } catch (e) { memo[k] = v; } }
};
const esc = v => String(v === undefined || v === null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const fmt = n => Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const dfr = s => s ? String(s).slice(0, 10).split('-').reverse().join('/') : '';
const dlong = s => { if (!s) return ''; const d = new Date(String(s).slice(0, 10) + 'T00:00:00'); return isNaN(d) ? String(s) : d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }); };
const oui = v => v === true || v === 'TRUE' || v === 'Oui' || v === 'true';
const actif = v => oui(v) || v === '' || v === undefined;
const by = (a, k, v) => (a || []).find(x => String(x[k]) === String(v));
const C = () => S.d.constantes;
const today = () => C().AUJOURDHUI;
const initiales = n => String(n || '?').split(/[\s@.]+/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join('');

let charges = 0;
function busy(on) { charges = Math.max(0, charges + (on ? 1 : -1)); $('loader').style.display = charges > 0 ? 'block' : 'none'; }
function api(fn, ...args) {
  const publics = ['apiDemanderCode', 'apiVerifierCode'];
  return new Promise((ok, ko) => {
    busy(true);
    google.script.run.withSuccessHandler(r => { busy(false); ok(r); })
      .withFailureHandler(e => {

        ko(new Error(msg));

}
/** Action serveur renvoyant {message, data} : met à jour l'écran. */
async function act(fn, args, apres) {

}
function toast(msg, err) {

  const box = $('toasts'); while (box.children.length > 2) box.firstChild.remove();

}

/* =====================================================================

function appliquerTheme() {

}
function theme(p) { store.set('theme', p); appliquerTheme(); S.menu = false; if (S.d) rendre(); }
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', appliquerTheme);
appliquerTheme();

/* =====================================================================

const I = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICO = {

  formateurs: I('<circle cx="12" cy="7.5" r="3.5"/><path d="M5 21a7 7 0 0 1 14 0"/>'),

  horloge: I('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'), coche: I('<path d="m5 12 5 5 9-10"/>'),

/* =====================================================================
   Démarrage et connexion
   ===================================================================== */
async function demarrer() {
  S.jeton = store.get('jeton');

  try {
    S.moi = await api('apiMoi');

}
function ecranConnexion(etape, email) {

}
async function demanderCode() {
  const email = $('lmail').value.trim(); if (!email) return;

  catch (e) { toast(e.message, true); $('lbtn').disabled = false; }
}

}
async function deconnexion() {

}
function finSession(msg) { store.set('jeton', null); S.jeton = null; S.d = null; S.moi = null; S.menu = false; ecranConnexion(); if (msg) toast(msg); }
function changerEspace(e) { S.espace = e; store.set('espace', e); S.menu = false; fermer(); S.vue = e === 'admin' ? 'accueil' : 'mesformations'; recharger(); }

/* =====================================================================
   Navigation
   ===================================================================== */
function navItems() {
  if (S.espace === 'formateur') return [['Formation', [['mesformations', 'Mes formations', 'formations']]]];
  const d = S.d, n = {
    proformas: d.PROFORMAS.filter(p => p['Statut'] === 'Émise').length,
    factures: d.FACTURES.filter(f => f['Statut'] !== 'Annulée' && Number(f['Reste à payer']) > 0).length,
    fmfp: relancesDues().length, formations: d.SESSIONS.filter(s => s['Alerte']).length

  const s = [['Pilotage', [['accueil', 'Accueil', 'accueil']]],
    ['Ventes', [['clients', 'Clients', 'clients'], ['proformas', 'Proformas', 'proformas', n.proformas], ['factures', 'Factures', 'factures', n.factures], ['catalogue', 'Catalogue', 'catalogue']]],
    ['Formation', [['formations', 'Formations', 'formations', n.formations], ['fmfp', 'Dossiers FMFP', 'fmfp', n.fmfp], ['formateurs', 'Formateurs', 'formateurs']]]];

}
function aller(v, sel) { S.vue = v; S.sel = sel || null; S.q = ''; S.menu = false; if (v !== 'parametres') S.set = null; fermer(); rendre(); window.scrollTo(0, 0); }

let apresRendu = null;

function rendre() {
  if (!S.d) return;

  const roleLib = S.moi.role + (S.moi.formateur && S.moi.role !== 'Formateur' ? ' · Formateur' : '');
  const contenu = (VUES[S.vue] || VUES[S.espace === 'admin' ? 'accueil' : 'mesformations'])();
  $('root').innerHTML = `<div class="app"><aside>
    <div class="brand"><span class="logo">MDC</span><div><b>${esc(C().SOCIETE)}</b><small>${S.espace === 'admin' ? 'Administration' : 'Espace formateur'}</small></div></div>
    ${nav.map(([t, items]) => `<div class="navsec">${t}</div>` + items.map(([v, lib, ic, cnt]) =>
      `<button class="navi ${base === v ? 'on' : ''}" onclick="aller('${v}')">${ICO[ic]}${lib}${cnt ? `<span class="cnt">${cnt}</span>` : ''}</button>`).join('')).join('')}
    <div class="me">${S.menu ? `<div class="menu">
        ${S.moi.admin && S.moi.formateur ? `<div class="lab">Espace</div><button onclick="changerEspace('admin')">${S.espace === 'admin' ? '✓ ' : '  '}Administration</button><button onclick="changerEspace('formateur')">${S.espace === 'formateur' ? '✓ ' : '  '}Formateur</button><hr>` : ''}
        <div class="lab">Apparence</div>${[['auto', 'Automatique'], ['light', 'Clair'], ['dark', 'Sombre']].map(([k, l]) => `<button onclick="theme('${k}')">${pref === k ? '✓ ' : '  '}${l}</button>`).join('')}
        <hr><button onclick="deconnexion()">Se déconnecter</button></div>` : ''}

  </aside><main>${contenu}</main></div>
  <nav class="mobnav">${nav.flatMap(x => x[1]).map(([v, lib, ic]) => `<button class="${base === v ? 'on' : ''}" onclick="aller('${v}')">${ICO[ic]}${lib.split(' ')[0]}</button>`).join('')}

    <div class="sb"><label class="f">Apparence</label><div class="seg">${[['auto', 'Auto'], ['light', 'Clair'], ['dark', 'Sombre']].map(([k, l]) => `<button class="${pref === k ? 'on' : ''}" onclick="theme('${k}');ouvrirCompte()">${l}</button>`).join('')}</div>

}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('layer').innerHTML) fermer(); else if (S.menu) { S.menu = false; rendre(); } } });
document.addEventListener('click', e => { if (S.menu && !e.target.closest('.me')) { S.menu = false; rendre(); } });

/* ---------- Panneaux & dialogues ---------- */
function feuille(html, large) { $('layer').innerHTML = `<div class="backdrop" onclick="fermer()"></div><div class="sheet ${large ? 'large' : ''}">${html}</div>`; }
function fermer() { $('layer').innerHTML = ''; }
function btnX() { return `<button class="x" onclick="fermer()" aria-label="Fermer">${ICO.x}</button>`; }
function confirmer(titre, texte, libOk, danger) {
  return new Promise(res => {
    const box = document.createElement('div');
    box.innerHTML = `<div class="backdrop" style="z-index:60"></div><div class="dialog"><h4>${titre}</h4><p>${texte}</p><div class="acts">

/* =====================================================================
   Helpers métier
   ===================================================================== */
function pill(txt, k) { return `<span class="pill ${k}">${esc(txt)}</span>`; }
function pillStatut(s) {
  const m = { 'Brouillon': 'p-n', 'Émise': 'p-b', 'Acceptée': 'p-g', 'Refusée': 'p-r', 'Annulée': 'p-n', 'Payée': 'p-g', 'Partielle': 'p-o',
    'Impayée': 'p-r', 'Trop-perçu': 'p-o', 'N.A. (dossier FMFP)': 'p-v' };
  const lib = { 'Émise': 'En attente', 'N.A. (dossier FMFP)': 'Dossier FMFP' }[s] || s || '—';
  return pill(lib, m[s] || 'p-n');
}
function relancesDues() { return (S.d.FMFP || []).filter(x => x['Prochaine relance'] && x['Prochaine relance'] <= today() && !/Clôturé/.test(x['Étape'])); }

function lignesDe(id) { return S.d.LIGNES.filter(l => l['ID Document'] === id).sort((a, b) => a['Ordre'] - b['Ordre']); }
function pctFacture(num) { return facturesDe(num).filter(f => f['Statut'] !== 'Annulée' && f['Compte dans encaissements'] === 'Oui').reduce((s, f) => s + Number(f['%'] || 0), 0); }
function barre(s) { return `<span class="bar" title="${esc(s['Phase actuelle'])}">${C().PHASES.map(p => { const v = s[p] || 'À faire'; return `<i class="${v === 'Fait' ? 'F' : v === 'En cours' ? 'E' : v === 'N.A.' ? 'N' : ''}"></i>`; }).join('')}</span>`; }
function tauxDoc(doc) { return doc['Taux TVA'] === '' || doc['Taux TVA'] === undefined || doc['Taux TVA'] === null ? C().TVA : Number(doc['Taux TVA']) || 0; }
function pctTxt(t) { return (Math.round(Number(t) * 1000) / 10).toString().replace('.', ',') + ' %'; }
function vide(titre, texte, action) { return `<div class="empty"><b>${titre}</b>${texte || ''}${action ? `<div style="margin-top:14px">${action}</div>` : ''}</div>`; }
function head(titre, sous, actions, crumb) {
  return `${crumb ? `<div class="crumb">${crumb}</div>` : ''}<div class="head"><div><h1>${titre}</h1>${sous ? `<div class="sub">${sous}</div>` : ''}</div><div class="sp"></div>${actions || ''}</div>`;
}
function rech(ph) { return `<div class="search">${ICO.cherche}<input placeholder="${ph || 'Rechercher'}" value="${esc(S.q)}" oninput="S.q=this.value;rafraichirListe()"></div>`; }
function rafraichirListe() { const el = $('liste'); if (el && LISTES[S.vue]) el.innerHTML = LISTES[S.vue](); }
function seg(cle, options, defaut) { const v = S.f[cle] === undefined ? (defaut || '') : S.f[cle]; return `<div class="seg">${options.map(([k, l]) => `<button class="${v === k ? 'on' : ''}" onclick="S.f['${cle}']='${k}';rendre()">${l}</button>`).join('')}</div>`; }
function lireForm(root) {
  const o = {};
  document.querySelectorAll(`#${root} [data-k]`).forEach(i => { o[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.value; });
  return o;
}
function enregistrerRef(onglet, ligne, root) { act('apiEnregistrer', [onglet, ligne, lireForm(root)], () => fermer()); }
function sw(k, on) { return `<label class="switch"><input type="checkbox" data-k="${k}" ${on ? 'checked' : ''}><span></span></label>`; }

/* ---------- Aperçu des documents (même gabarit que le PDF) ---------- */
function ctxBase() { return JSON.parse(JSON.stringify(C().DOC)); }
function ctxEntite(id) {
  const e = by(S.d.ENTITES, 'ID Entité', id) || {};
  return { client: { nom: e['Raison sociale'] || '', adresse: e['Adresse'], email: e['Email'], tel: e['Téléphone'], nif: e['NIF'], stat: e['STAT'] }, particulier: !e['NIF'] && !e['STAT'] };
}
function validiteTxt(date, jours) { if (!date) return ''; const d = new Date(String(date).slice(0, 10) + 'T00:00:00'); d.setDate(d.getDate() + Number(jours || 30)); return d.toLocaleDateString('fr-FR'); }
function ctxDocument(type, doc) {
  const c = Object.assign(ctxBase(), ctxEntite(doc['ID Entité']));
  const estPF = type === 'PF', taux = tauxDoc(doc);
  const lignes = lignesDe(doc['ID']).map(l => ({ domaine: l['Domaine'], designation: l['Désignation'], lieu: l['Lieu'], duree: l['Durée'], quantite: l['Quantité'], pu: l['Prix unitaire HT'], montant: l['Montant HT'] }));
  const pf = estPF ? doc : (by(S.d.PROFORMAS, 'N°', doc['N° Proforma']) || {});
  return Object.assign(c, { titre: estPF ? 'Facture Proforma' : 'Facture', numero: doc['N°'], date: dfr(doc['Date']), validite: estPF ? validiteTxt(doc['Date'], doc['Validité (jours)']) : '',
    refProforma: estPF ? '' : doc['N° Proforma'], contact: doc['Contact client'], objet: pf['Objet'], typeLibelle: estPF ? '' : doc['Type'],
    pct: estPF ? 100 : Number(doc['%']) || 100, lignes, htLignes: lignes.reduce((s, l) => s + Number(l.montant || 0), 0),
    ht: doc['Total HT'], tva: doc['TVA'], ttc: doc['Total TTC'], taux, avecTva: taux > 0, brouillon: !doc['N°'] });
}
function papier(id) { return `<div class="paper" id="${id}"><iframe title="Aperçu du document"></iframe></div>`; }
function remplirPapier(id, ctx) {

function etapesProforma(p) {

    const p = by(S.d.PROFORMAS, 'ID', id);
    S.ed = { id, idEntite: p['ID Entité'], date: p['Date'], validite: p['Validité (jours)'], contact: p['Contact client'], objet: p['Objet'], lieu: p['Lieu'],

      lignes: lignesDe(id).map(l => ({ code: l['Code'], domaine: l['Domaine'], designation: l['Désignation'], duree: l['Durée'], quantite: Number(l['Quantité']), pu: Math.abs(Number(l['Prix unitaire HT'])) })) };
  } else {
    const e = idEntite ? by(S.d.ENTITES, 'ID Entité', idEntite) : null;
    S.ed = { id: null, idEntite: idEntite || '', date: today(), validite: C().VALIDITE, contact: e ? (e['Contact principal'] || '') : '', objet: '', lieu: '',
      avecTva: !!C().TVA_DEFAUT, tauxTva: C().TAUX_TVA, lignes: [] };
  }
  S.vue = 'editeur'; S.sel = null; rendre(); window.scrollTo(0, 0);
}
function montantLigne(l) { const m = (Number(l.quantite) || 0) * (Number(l.pu) || 0); return l.code === 'DIV-REMISE' ? -Math.abs(m) : m; }
function totauxEd() {
  const ht = S.ed.lignes.reduce((s, l) => s + montantLigne(l), 0), taux = S.ed.avecTva ? Number(S.ed.tauxTva) || 0 : 0, tva = Math.round(ht * taux);
  return { ht, taux, tva, ttc: ht + tva };
}
function ctxEditeur() {

    lignes: ed.lignes.filter(l => l.designation).map(l => ({ domaine: l.domaine || 'Divers', designation: l.designation, lieu: ed.lieu, duree: l.duree, quantite: l.quantite, pu: l.pu, montant: montantLigne(l) })),
    htLignes: t.ht, ht: t.ht, tva: t.tva, ttc: t.ttc, taux: t.taux, avecTva: t.taux > 0, brouillon: true });
}
let tApercu = null;

function majTotaux() {

}
function edSet(k, v, re) { S.ed[k] = v; if (re) rendre(); else majApercu(); }
function ligneSet(i, k, v) { S.ed.lignes[i][k] = (k === 'quantite' || k === 'pu') ? Number(v) : v; majApercu(); }

async function enregistrerEd(emettre) {

  if (!data.idEntite) return toast('Choisissez un client.', true);
  if (!data.lignes.length) return toast('Ajoutez au moins une prestation.', true);
  if (emettre && !await confirmer('Émettre la proforma ?', 'Un numéro officiel sera attribué et le PDF généré. Le document ne sera plus modifiable.', 'Émettre')) return;
  const r = await act(ed.id ? 'apiMajBrouillon' : 'apiCreerProforma', ed.id ? [ed.id, data] : [data]);

  if (emettre) { S.vue = 'proformas'; rendre(); ficheProforma(id); } else { S.ed.id = id; rendre(); }
}

      <div class="w2"><label class="f">Lieu</label><input data-k="Lieu" value="${esc(s['Lieu'])}"></div><div class="w2"><label class="f">Participants prévus</label><input type="number" data-k="Nb participants" value="${esc(s['Nb participants'])}"></div>
      <div class="w4"><label class="f">Lien du dossier</label><input data-k="Lien dossier" value="${esc(s['Lien dossier'])}" placeholder="Lien Drive du dossier de formation"></div>
      <div class="w4"><label class="f">Formateurs affectés</label><div class="chips" id="ffo">${S.d.FORMATEURS.filter(t => actif(t['Actif']) || choisis.includes(t['ID Formateur'])).map(t => `<span class="chip ${choisis.includes(t['ID Formateur']) ? 'on' : ''}" data-id="${esc(t['ID Formateur'])}" onclick="this.classList.toggle('on')">${esc(t['Nom'])}</span>`).join('') || '<span class="mut">Aucun formateur.</span>'}</div></div>
      <div class="w4"><label class="f">Notes</label><textarea data-k="Notes">${esc(s['Notes'])}</textarea></div></div>
      <button class="btn p" style="margin-top:16px" onclick="act('apiSessionInfos',['${ids}',lireForm('fin'),[...document.querySelectorAll('#ffo .chip.on')].map(c=>c.dataset.id)])">Enregistrer</button>`
    : `<div class="kv"><span>Client</span><div style="font-weight:500">${esc(s['Raison sociale'])}</div><span>Intitulé</span><div>${esc(s['Intitulé'])}</div><span>Dates</span><div>${s['Date début'] ? dlong(s['Date début']) : 'À planifier'}${s['Date fin'] ? ' → ' + dlong(s['Date fin']) : ''}</div>
      <span>Lieu</span><div>${esc(s['Lieu'] || '—')}</div><span>Formateurs</span><div>${esc(s['Formateur(s)'] || '—')}</div><span>Dossier</span><div>${s['Lien dossier'] ? `<a href="${esc(s['Lien dossier'])}" target="_blank">Ouvrir</a>` : '—'}</div><span>Notes</span><div>${esc(s['Notes'] || '—')}</div></div>`}</div>`;
  return head(esc(s['Raison sociale']), `${esc(s['Intitulé'])} · ${s['Date début'] ? dlong(s['Date début']) : 'dates à planifier'}`,
    `${fm ? `<button class="btn" onclick="ficheFmfp(${fm._row})">Dossier FMFP</button>` : ''}${pf ? `<button class="btn" onclick="ficheProforma('${pf['ID']}')">Proforma</button>` : ''}`,
    `<a onclick="aller('${admin ? 'formations' : 'mesformations'}')">${admin ? 'Formations' : 'Mes formations'}</a> › ${ids}`) +
    `<div style="margin-bottom:16px">${seg('st', [['phases', 'Phases'], ['participants', `Participants (${parts.length})`], ['infos', 'Informations']], 'phases')}</div>${corps}`;
};
async function supprimerParticipant(row) { if (await confirmer('Retirer ce participant ?', 'Cette action est définitive.', 'Retirer', true)) act('apiSupprimerParticipant', [S.espace, row]); }

/* ---------- Dossiers FMFP ---------- */
VUES.fmfp = () => {
  const E = C().ETAPES_FMFP, due = x => x['Prochaine relance'] && x['Prochaine relance'] <= today() && !/Clôturé/.test(x['Étape']);
  return head('Dossiers FMFP', 'Facture 100 % et CV → acompte 70 % → formation → rapports, présences et solde 30 % → clôture.',
    `<button class="btn" onclick="act('apiRelancesHubSpot')">Créer les relances dues dans HubSpot</button>`) +
  (S.d.FMFP.length ? `<div class="board">${E.map(e => { const xs = S.d.FMFP.filter(x => (x['Étape'] || E[0]) === e);
    return `<div class="col"><h4>${esc(e.replace(/^\d\. /, ''))}<span>${xs.length}</span></h4>${xs.map(x => `<div class="kc ${due(x) ? 'due' : ''}" onclick="ficheFmfp(${x._row})"><b>${esc(x['Raison sociale'])}</b>
      <div class="mut" style="font-size:12px">${esc(x['ID Session'])} · ${esc(x['N° Proforma'])}</div>${x['Prochaine relance'] ? `<div style="font-size:12px;margin-top:4px;color:${due(x) ? 'var(--red)' : 'var(--text-2)'}">Relance ${dlong(x['Prochaine relance'])}</div>` : ''}</div>`).join('')}</div>`; }).join('')}</div>`
    : `<div class="list">${vide('Aucun dossier FMFP', 'Un dossier s\'ouvre lorsqu\'une formation financée par le FMFP est créée.')}</div>`);
};
function ficheFmfp(row) {
  const x = S.d.FMFP.find(y => y._row === row);
  if (!x) return;
  const lienF = n => { const f = by(S.d.FACTURES, 'N°', n); return n ? (f ? `<a style="cursor:pointer" onclick="ficheFacture('${f['ID']}')">${esc(n)}</a> ${pillStatut(f['Statut paiement'])}` : esc(n)) : '<span class="mut3">Pas encore émise</span>'; };
  const ligne = (k, lab) => `<div class="gitem"><div class="k"><b>${lab}</b></div><div class="v">${sw(k, oui(x[k]))}</div></div>`;
  feuille(`<div class="sh"><div class="sp"><div class="mut" style="font-size:12.5px">Dossier FMFP</div><h3>${esc(x['Raison sociale'])}</h3><div class="mut">${esc(x['ID Session'])} · étape depuis le ${dlong(x['Date étape'])}</div></div>${btnX()}</div>
  <div class="sb" id="ffm"><label class="f" style="margin-top:0">Étape</label><select data-k="Étape">${C().ETAPES_FMFP.map(e => `<option ${e === x['Étape'] ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>
    <p class="hint">Changer d'étape programme automatiquement la prochaine relance.</p>
    <div class="gtitle" style="margin-top:22px">Factures</div><div class="group"><div class="gitem"><div class="k"><b>100 % (dossier)</b></div><div class="v">${lienF(x['N° Facture 100 %'])}</div></div>
      <div class="gitem"><div class="k"><b>Acompte 70 %</b></div><div class="v">${lienF(x['N° Facture 70 %'])}</div></div><div class="gitem"><div class="k"><b>Solde 30 %</b></div><div class="v">${lienF(x['N° Facture 30 %'])}</div></div></div>
    <div class="gtitle">Pièces envoyées</div><div class="group">${ligne('CV formateurs envoyés', 'CV des formateurs')}${ligne('Rapports envoyés', 'Rapports de formation')}${ligne('Fiches de présence envoyées', 'Fiches de présence')}</div>
    <div class="gtitle">Suivi</div><div class="group"><div class="gitem"><div class="k"><b>Prochaine relance</b><small>${oui(x['Relance HubSpot créée']) ? 'Tâche HubSpot créée' : 'Pas de tâche HubSpot'}</small></div><div class="v"><input type="date" style="width:170px" data-k="Prochaine relance" value="${esc(x['Prochaine relance'])}"></div></div>
      <div class="gitem" style="display:block"><textarea data-k="Commentaire" placeholder="Commentaire">${esc(x['Commentaire'])}</textarea></div></div></div>
  <div class="sf"><button class="btn p" onclick="act('apiMajFmfp',[${row},lireForm('ffm')],()=>fermer())">Enregistrer</button><button class="btn" onclick="aller('session','${esc(x['ID Session'])}')">Voir la formation</button></div>`);
}

/* ---------- Formateurs ---------- */
VUES.formateurs = () => head('Formateurs', 'Fiches formateurs. Pour leur ouvrir l\'espace formateur, créez un utilisateur.', `<button class="btn p" onclick="ficheFormateur()">${ICO.plus}Nouveau formateur</button>`) +
  `<div class="list">${S.d.FORMATEURS.length ? `<table class="resp"><thead><tr><th>Formateur</th><th>Domaines</th><th>Formations</th><th>Accès</th><th></th></tr></thead><tbody>${S.d.FORMATEURS.map(t => {
    const n = S.d.SESSIONS.filter(s => String(s['ID Formateurs'] || '').split(',').map(x => x.trim()).includes(t['ID Formateur'])).length;
    const u = (S.d.UTILISATEURS || []).find(x => x['ID Formateur'] === t['ID Formateur']);
    return `<tr class="cl" onclick="ficheFormateur(${t._row})"><td class="main"><b>${esc(t['Nom'])}</b><small>${esc(t['Email'] || '')}</small></td><td class="mut">${esc(t['Domaines'] || '—')}</td><td class="num">${n}</td>
      <td>${u ? pill(oui(u['Actif']) ? 'Peut se connecter' : 'Compte inactif', oui(u['Actif']) ? 'p-g' : 'p-n') : '<span class="mut3">—</span>'}</td><td>${actif(t['Actif']) ? '' : pill('Inactif', 'p-n')}</td></tr>`; }).join('')}</tbody></table>` : vide('Aucun formateur')}</div>`;
function ficheFormateur(row) {
  const t = row ? S.d.FORMATEURS.find(x => x._row === row) : { 'Actif': true };
  const ch = (k, lab, cls, type) => `<div class="${cls || ''}"><label class="f">${lab}</label><input data-k="${k}" type="${type || 'text'}" value="${esc(t[k])}"></div>`;
  const aCompte = (S.d.UTILISATEURS || []).some(u => u['ID Formateur'] === t['ID Formateur']);
  feuille(`<div class="sh"><div class="sp"><h3>${row ? esc(t['Nom']) : 'Nouveau formateur'}</h3><div class="mut">${row ? esc(t['ID Formateur']) : ''}</div></div>${btnX()}</div>
  <div class="sb"><div class="form" id="ft">${ch('Nom', 'Nom', 'w4')}${ch('Email', 'E-mail', 'w2', 'email')}${ch('Téléphone', 'Téléphone', 'w2')}${ch('Domaines', 'Domaines', 'w4')}${ch('Lien CV (FMFP)', 'Lien du CV (format FMFP)', 'w4')}${ch('Tarif journalier', 'Tarif journalier', 'w2', 'number')}</div>
    <div class="group" style="margin-top:18px"><div class="gitem"><div class="k"><b>Actif</b></div><div class="v">${sw('Actif', actif(t['Actif']))}</div></div></div></div>
  <div class="sf"><button class="btn p" onclick="enregistrerRef('Formateurs', ${row || 0}, 'ft')">Enregistrer</button>${S.moi.superadmin && row && !aCompte ? `<button class="btn" onclick="ficheUtilisateur(0,{Email:${esc(JSON.stringify(t['Email'] || ''))},Nom:${esc(JSON.stringify(t['Nom'] || ''))},'Rôle':'Formateur','ID Formateur':'${esc(t['ID Formateur'])}'})">Donner accès à la plateforme</button>` : ''}</div>`);
}

/* ---------- Utilisateurs et rôles ---------- */
VUES.utilisateurs = () => head('Utilisateurs et rôles', 'Seules les adresses enregistrées et actives peuvent se connecter.', `<button class="btn p" onclick="ficheUtilisateur()">${ICO.plus}Nouvel utilisateur</button>`) +
  `<div class="grid g3" style="margin-bottom:18px">${[['Formateur', 'p-n', 'Voit uniquement ses formations : phases 2 à 6, participants, présences, évaluations.'], ['Administrateur', 'p-b', 'Gère clients, proformas, factures, formations et dossiers FMFP. Peut aussi être formateur.'], ['Superadmin', 'p-v', 'Tous les droits, plus les utilisateurs, les rôles et les paramètres.']].map(([r, k, t]) => `<div class="card" style="margin:0;padding:16px">${pill(r, k)}<div class="mut" style="font-size:13px;margin-top:8px">${t}</div></div>`).join('')}</div>
  <div class="list"><table class="resp"><thead><tr><th>Utilisateur</th><th>Rôle</th><th>Espace formateur</th><th>Dernière connexion</th><th>Statut</th></tr></thead><tbody>${S.d.UTILISATEURS.map(u => {
    const estF = oui(u['Est formateur']) || u['Rôle'] === 'Formateur';
    return `<tr class="cl" onclick="ficheUtilisateur(${u._row})">
    <td class="main"><div style="display:flex;gap:10px;align-items:center"><span class="avatar">${esc(initiales(u['Nom'] || u['Email']))}</span><div><b>${esc(u['Nom'] || '—')}</b><small>${esc(u['Email'])}</small></div></div></td>
    <td>${pill(u['Rôle'], u['Rôle'] === 'Superadmin' ? 'p-v' : u['Rôle'] === 'Administrateur' ? 'p-b' : 'p-n')}</td><td>${estF ? esc((by(S.d.FORMATEURS, 'ID Formateur', u['ID Formateur']) || {})['Nom'] || 'Oui') : '<span class="mut3">—</span>'}</td>
    <td class="mut">${u['Dernière connexion'] ? dlong(u['Dernière connexion']) : 'Jamais'}</td><td>${oui(u['Actif']) ? pill('Actif', 'p-g') : pill('Inactif', 'p-n')}</td></tr>`; }).join('')}</tbody></table></div>`;
function ficheUtilisateur(row, pre) {
  const u = row ? S.d.UTILISATEURS.find(x => x._row === row) : Object.assign({ 'Rôle': 'Formateur', 'Actif': 'Oui' }, pre || {});
  const r = u['Rôle'];
  feuille(`<div class="sh"><div class="sp"><h3>${row ? esc(u['Nom'] || u['Email']) : 'Nouvel utilisateur'}</h3><div class="mut">La connexion se fait par un code envoyé à cette adresse.</div></div>${btnX()}</div>
  <div class="sb" id="fu"><label class="f" style="margin-top:0">E-mail</label><input data-k="Email" type="email" value="${esc(u['Email'])}" placeholder="nom@exemple.com"><label class="f">Nom</label><input data-k="Nom" value="${esc(u['Nom'])}">
    <label class="f">Rôle</label><div class="seg" id="useg">${C().ROLES.map(x => `<button class="${r === x ? 'on' : ''}" onclick="choisirRole('${x}',this)">${x}</button>`).join('')}</div>
    <input type="hidden" id="urole" data-k="Rôle" value="${esc(r)}">
    <div class="group" style="margin-top:18px">
      <div class="gitem" id="uform" style="display:${r === 'Formateur' ? 'none' : 'flex'}"><div class="k"><b>Est aussi formateur</b><small>Donne accès à l'espace formateur en plus</small></div><div class="v">${sw('Est formateur', oui(u['Est formateur']))}</div></div>
      <div class="gitem"><div class="k"><b>Fiche formateur liée</b><small>Créée automatiquement si « Automatique »</small></div><div class="v"><select data-k="ID Formateur" style="max-width:230px"><option value="">Automatique</option>${S.d.FORMATEURS.map(t => `<option value="${esc(t['ID Formateur'])}" ${t['ID Formateur'] === u['ID Formateur'] ? 'selected' : ''}>${esc(t['Nom'])}</option>`).join('')}</select></div></div>
      <div class="gitem"><div class="k"><b>Actif</b><small>Désactiver coupe l'accès immédiatement</small></div><div class="v">${sw('Actif', oui(u['Actif']))}</div></div></div></div>
  <div class="sf"><button class="btn p" onclick="act('apiUtilisateur',[${row || 0},lireForm('fu')],()=>fermer())">Enregistrer</button></div>`);
}
function choisirRole(x, b) {
  $('urole').value = x; b.parentNode.querySelectorAll('button').forEach(e => e.classList.remove('on')); b.classList.add('on');
  $('uform').style.display = x === 'Formateur' ? 'none' : 'flex';
}

/* ---------- Paramètres ---------- */
VUES.parametres = () => {
  const schema = C().SCHEMA, vals = {};
  S.d.PARAMS.forEach(p => vals[p['Clé']] = p['Valeur']);
  const val = k => S.set && S.set[k] !== undefined ? S.set[k] : vals[k];
  const groupes = [...new Set(schema.map(p => p[3]))].concat(['Avancé']);
  const ong = S.f.pa || groupes[0];
  const champ = ([k, , lib, , type, aide]) => {
    const v = val(k);
    let ctl;
    if (type === 'toggle') ctl = `<label class="switch"><input type="checkbox" ${oui(v) ? 'checked' : ''} onchange="setParam('${k}',this.checked?'Oui':'Non')"><span></span></label>`;
    else if (type === 'percent') ctl = `<input type="number" step="0.1" style="width:110px;text-align:right" value="${v === '' || v === undefined ? '' : Math.round(Number(v) * 1000) / 10}" oninput="setParam('${k}',this.value===''?'':Number(this.value)/100)"><span class="mut">%</span>`;
    else if (type === 'number') ctl = `<input type="number" style="width:140px;text-align:right" value="${esc(v)}" oninput="setParam('${k}',this.value)">`;
    else if (type === 'textarea') ctl = `<textarea rows="2" oninput="setParam('${k}',this.value)">${esc(v)}</textarea>`;
    else if (type === 'color') ctl = `<span class="mut num">${esc(v)}</span><input type="color" value="${esc(v || '#000000')}" oninput="this.previousElementSibling.textContent=this.value;setParam('${k}',this.value)">`;
    else if (type === 'image') { const src = k === 'LOGO_FILE_ID' ? C().DOC.logo : C().DOC.signature;
      ctl = `<div class="gimg">${src ? `<img src="${src}" alt="">` : '<span class="mut3" style="font-size:12px">Aucune image</span>'}</div><label class="btn sm">Choisir…<input type="file" accept="image/png,image/jpeg" hidden onchange="televerser('${k}',this)"></label>${v ? `<button class="btn sm t" onclick="act('apiSupprimerImage',['${k}'])">Retirer</button>` : ''}`; }
    else if (type === 'readonly') ctl = v ? `<a target="_blank" href="https://drive.google.com/drive/folders/${esc(v)}">Ouvrir dans Drive</a>` : '<span class="mut3">—</span>';
    else ctl = `<input value="${esc(v)}" oninput="setParam('${k}',this.value)">`;
    return `<div class="gitem"><div class="k"><b>${esc(lib)}</b>${aide ? `<small>${esc(aide)}</small>` : ''}</div><div class="v">${ctl}</div></div>`;
  };
  const an = today().slice(0, 4);
  let corps;
  if (ong === 'Avancé') {
    const autres = S.d.PARAMS.filter(p => !schema.some(s => s[0] === p['Clé']));
    corps = `<div class="gtitle">Paramètres personnalisés</div><div class="group">${autres.map(p => `<div class="gitem"><div class="k"><b>${esc(p['Clé'])}</b><small>${esc(p['Description'])}</small></div><div class="v"><input value="${esc(val(p['Clé']))}" oninput="setParam('${esc(p['Clé'])}',this.value)"></div></div>`).join('')}
        <div class="gitem"><div class="k"><input id="nk" placeholder="NOUVELLE_CLE"></div><div class="v"><input id="nv" placeholder="Valeur"><button class="btn sm" onclick="const k=$('nk').value.trim().toUpperCase().replace(/[^A-Z0-9_]/g,'_');if(k){setParam(k,$('nv').value,true)}">Ajouter</button></div></div></div>
      <div class="gtitle">HubSpot</div><div class="group"><div class="gitem"><div class="k"><b>Clé d'accès</b><small>${C().HUBSPOT ? 'Configurée' : 'Absente'} · stockée dans le script, jamais dans la base</small></div><div class="v"><input id="hk" type="password" placeholder="pat-…" style="max-width:240px"><button class="btn sm" onclick="act('apiCleHubSpot',[$('hk').value])">Enregistrer</button></div></div>
        <div class="gitem"><div class="k"><b>Entreprises</b><small>Crée et met à jour les clients depuis HubSpot</small></div><div class="v"><button class="btn sm" ${C().HUBSPOT ? '' : 'disabled'} onclick="act('apiSyncHubSpot')">Synchroniser</button><button class="btn sm t" onclick="act('apiImportHubSpot')">Importer l'onglet</button></div></div></div>`;
  } else {
    corps = `<div class="group">${schema.filter(p => p[3] === ong).map(champ).join('')}</div>`;
    if (ong === 'Numérotation') corps += `<div class="gtitle">Compteurs ${an}</div><div class="group">${['PF', 'DE'].map(t => {
      const c = (S.d.COMPTEURS || []).find(x => String(x['Année']) === an && x['Type'] === t);
      const dernier = c ? Number(c['Dernier numéro']) : Number(vals['COMPTEUR_DEPART_' + t + '_' + an] || 0);
      return `<div class="gitem"><div class="k"><b>${t === 'PF' ? 'Proformas' : 'Factures'}</b><small>Dernier numéro utilisé · prochain : ${String(dernier + 1).padStart(5, '0')} · ne peut que monter</small></div><div class="v"><input type="number" id="cpt${t}" style="width:110px;text-align:right" value="${dernier}"><button class="btn sm" onclick="act('apiCompteur',[${an},'${t}',$('cpt${t}').value])">Appliquer</button></div></div>`; }).join('')}</div>`;
  }
  apresRendu = majSavebar;
  return head('Paramètres', 'Modifiables à tout moment. Les documents déjà émis ne changent pas.') +
    `<div style="margin-bottom:20px">${seg('pa', groupes.map(g => [g, g]), groupes[0])}</div>${corps}<div id="savebar"></div>`;
};
function majSavebar() {
  const el = $('savebar'); if (!el) return;
  const n = S.set ? Object.keys(S.set).length : 0;
  el.innerHTML = n ? `<div class="savebar"><span class="mut" style="margin-right:auto">${n} modification(s) non enregistrée(s)</span><button class="btn" onclick="S.set=null;rendre()">Annuler</button><button class="btn p" onclick="act('apiParametres',[S.set],()=>{S.set=null})">Enregistrer</button></div>` : '';
}
function setParam(k, v, force) { if (!S.set) S.set = {}; S.set[k] = v; if (force) rendre(); else majSavebar(); }
function televerser(cle, input) {
  const f = input.files[0]; if (!f) return;
  if (f.size > 2 * 1024 * 1024) return toast('Image trop lourde (2 Mo maximum).', true);
  const rd = new FileReader();
  rd.onload = () => act('apiTeleverserImage', [cle, String(rd.result).split(',')[1], f.type, f.name]);
  rd.readAsDataURL(f);
}

demarrer();
</script>
</body>
</html>
